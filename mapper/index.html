<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blocked — campus map planner</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f1418; color: #eee8dc;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; background: #151c22; border-bottom: 1px solid #c9a227; }
  header h1 { margin: 0 14px 0 0; font-size: 14px; letter-spacing: .1em; color: #c9a227; }
  button, input, select { font: inherit; background: #1b2228; color: #eee8dc;
    border: 1px solid #4a5055; border-radius: 3px; padding: 5px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: #c9a227; }
  button.primary { background: #c9a227; color: #10151a; border-color: #c9a227; font-weight: 700; }
  input { width: 150px; }
  #hint { color: #9aa3a8; margin-left: auto; }
  main { display: grid; grid-template-columns: 1fr 310px; min-height: 0; }
  #stage { position: relative; min-width: 0; min-height: 0; background: #0a0e12; }
  #map { display: block; width: 100%; height: 100%; cursor: crosshair; }
  aside { border-left: 1px solid #4a5055; background: #12181e; overflow: auto; padding: 10px; }
  aside h2 { font-size: 11px; letter-spacing: .08em; color: #c9a227; margin: 4px 0 8px; }
  .region { border: 1px solid #3b444b; border-radius: 4px; padding: 7px; margin: 0 0 6px; }
  .region .top { display: flex; gap: 5px; align-items: center; }
  .region .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .region input { width: 100%; padding: 3px 5px; }
  .region select { width: 100%; padding: 3px 5px; margin-top: 4px; }
  .region .meta { color: #8d979d; font-size: 10px; margin-top: 4px; display: flex;
    justify-content: space-between; }
  .region button { padding: 2px 5px; color: #e2a0a0; border-color: #5a3b3b; }
  #empty { color: #78838a; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1>BLOCKED // MAP PLANNER</h1>
  <input id="name" placeholder="Region name" value="Playable core">
  <select id="kind">
    <option value="playable">playable core</option>
    <option value="field">field</option>
    <option value="terrace">terraces</option>
    <option value="building">building</option>
    <option value="library">library</option>
    <option value="science">science</option>
    <option value="path">path</option>
    <option value="base-red">red base</option>
    <option value="base-blue">blue base</option>
    <option value="hazard">hazard/flood</option>
    <option value="other">other</option>
  </select>
  <button id="reset">Reset view</button>
  <button id="toggle">Show zones</button>
  <button id="export" class="primary">Download regions.json</button>
  <button id="clear">Clear</button>
  <span id="hint">drag to select · wheel zoom · right-drag pan</span>
</header>
<main>
  <div id="stage"><canvas id="map"></canvas></div>
  <aside>
    <h2>REGIONS <span id="count">0</span></h2>
    <div id="empty">Draw a rectangle on the map.<br><br>
      Mark one region as <b>playable core</b>; label the rest by zone. Export hands the
      rectangles back for conversion to arena fills.</div>
    <div id="regions"></div>
  </aside>
</main>
<script type="module" src="/mapper/main.js"></script>
</body>
</html>
